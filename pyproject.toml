[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-drift"
version = "0.1.0"
description = "Detect when an LLM's behavior has silently changed over time"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
